global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'payment-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-api:8080']

  - job_name: 'ledger-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ledger-service:8081']

  - job_name: 'recon-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['recon-service:8082']
